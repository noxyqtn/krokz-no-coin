<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Krokz No Coin</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #09090b; }
        #gameContainer { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #loading { color: white; font-family: sans-serif; font-size: 24px; }
    </style>
    <!-- Usiamo il loader di Unity che hai già nel repository -->
    <script src="UnityLoader.2019.2.js"></script>
</head>
<body>
    <div id="gameContainer">
        <div id="loading">Caricamento in corso...</div>
    </div>

    <script>
        // Avvia il gioco quando la pagina è pronta
        window.onload = function() {
            // Rimuove la scritta di caricamento
            document.getElementById("loading").style.display = "none";
            
            // Inizializza Unity. 
            // Nota: "Build/SanFrancisco.json" è il percorso del file json dentro la tua cartella
            var gameInstance = UnityLoader.instantiate("gameContainer", "Build/SanFrancisco.json", {
                onProgress: function(instance, progress) {
                    // Se vuoi, qui puoi aggiungere una barra di caricamento
                    if (progress === 1) {
                        console.log("Gioco caricato con successo!");
                    }
                }
            });
        };
    </script>
</body>
</html>
