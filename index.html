<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Krokz No Coin</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #09090b; }
        #gameContainer { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #loading { color: white; font-family: sans-serif; font-size: 24px; }
    </style>
    <script src="UnityLoader.2019.2.js"></script>
</head>
<body>
    <div id="gameContainer">
        <div id="loading">Caricamento in corso...</div>
    </div>

    <script>
        window.onload = function() {
            document.getElementById("loading").style.display = "none";
            
            var gameInstance = UnityLoader.instantiate("gameContainer", "Build/SanFrancisco.json", {
                // 1. Forza il superamento del controllo di compatibilità
                compatibilityCheck: function() {
                    return true;
                },
                // 2. Fornisci la configurazione completa per evitare l'errore 'cachedDecompressedFileSizes'
                Module: {
                    // Questi sono i dati di configurazione che il loader si aspetta
                    cachedDecompressedFileSizes: {
                        'SanFrancisco.asm.code.unityweb': 9077143,
                        'SanFrancisco.asm.framework.unityweb': 86369,
                        'SanFrancisco.asm.memory.unityweb': 951447,
                        'SanFrancisco.data.unityweb': 18323917,
                        'SanFrancisco.wasm.code.unityweb': 7279617,
                        'SanFrancisco.wasm.framework.unityweb': 90693
                    }
                },
                onProgress: function(instance, progress) {
                    if (progress === 1) {
                        console.log("Gioco caricato con successo!");
                    }
                }
            });
        };
    </script>
</body>
</html>
